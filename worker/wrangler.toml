name = "onle-inquiry"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 공개 설정값. 비밀값(TURNSTILE_SECRET)은 `wrangler secret put TURNSTILE_SECRET`으로 등록
[vars]
ALLOWED_ORIGINS = "https://company.onle.kr,https://heijungkim.github.io"
TO_EMAIL = "onle0803@gmail.com"

# IP별 정확한 속도 제한 (Durable Object, 무료 플랜 포함)
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
